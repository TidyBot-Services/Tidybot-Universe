# Include in nginx's http context. Replace all placeholders before S1 review.
# Each address gets its own allowance, with room for the live camera's ~12 requests/second.
limit_req_zone $binary_remote_addr zone=attentionbench:10m rate=60r/s;

server {
    listen 443 ssl default_server;
    server_name __DNS_NAME__;
    ssl_certificate __TLS_CERTIFICATE__;
    ssl_certificate_key __TLS_PRIVATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # No access log means no addresses, cookies, query strings or request bodies are recorded here.
    access_log off;
    error_log __NGINX_ERROR_LOG__ warn;
    # JSON_LIMIT in server.py is 8192 bytes, the largest accepted request body.
    client_max_body_size 8k;
    limit_req zone=attentionbench burst=120 nodelay;
    limit_req_status 429;

    # This account-writable file must be readable (and its parents searchable) by nginx.
    if (-f __MAINTENANCE_FILE__) { return 503; }

    proxy_set_header Host $host;
    # Overwrite the browser's header. Only loopback nginx may supply the address to trusted_proxy.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 5s;
    # Live frames are fetched as individual GET /live and /live/frame requests, not a websocket.
    # The signed upstream link can wait 120 seconds; leave margin for it and stream video immediately.
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
    proxy_buffering off;

    # Explicit gateway route list. Logout is DELETE /api/session; there is no /logout route.
    location = / { proxy_pass http://127.0.0.1:8861; }
    location = /login { proxy_pass http://127.0.0.1:8861; }
    location = /ui { proxy_pass http://127.0.0.1:8861; }
    location /ui/ { proxy_pass http://127.0.0.1:8861; }
    location = /api/session { proxy_pass http://127.0.0.1:8861; }
    location = /api/home/status { proxy_pass http://127.0.0.1:8861; }
    location = /api/home/scene { proxy_pass http://127.0.0.1:8861; }
    location = /api/lobby { proxy_pass http://127.0.0.1:8861; }
    location = /api/run-options { proxy_pass http://127.0.0.1:8861; }
    location = /api/runs { proxy_pass http://127.0.0.1:8861; }
    location = /api/notices { proxy_pass http://127.0.0.1:8861; }
    location = /api/provider/presets { proxy_pass http://127.0.0.1:8861; }
    location = /api/provider/credentials { proxy_pass http://127.0.0.1:8861; }
    location /api/provider/credentials/ { proxy_pass http://127.0.0.1:8861; }
    location = /api/dev-v2/experiments { proxy_pass http://127.0.0.1:8861; }
    location /api/dev-v2/experiments/ { proxy_pass http://127.0.0.1:8861; }
    # The gateway applies its narrower default-deny policy within the prefixes above.
    location / { return 404; }
}
