<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AttentionBench · Operations</title><style>html,body{margin:0;min-height:100%;background:#111119}
  #attentionbench-clear .ab-execution-viewer {min-width:0;}
  #attentionbench-clear .ab-history-tabs {display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;}
  #attentionbench-clear .ab-history-tabs button, #attentionbench-clear [data-history-select] {background:var(--surface-2,#252430);border:1px solid var(--line,#3e3b4d);color:var(--muted,#aaa6b8);font:inherit;font-size:13px;padding:9px 12px;cursor:pointer;}
  #attentionbench-clear .ab-history-tabs button[aria-pressed=true] {border-color:var(--orange);background:rgba(255,140,0,.09);color:var(--orange);}
  #attentionbench-clear .ab-viewer-layout {display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:20px;}
  #attentionbench-clear .ab-viewer-media, #attentionbench-clear .ab-viewer-trace {min-width:0;}
  #attentionbench-clear .ab-viewer-media figure {margin:0;background:#090b0d;}
  #attentionbench-clear .ab-viewer-media figure + figure {margin-top:12px;}
  #attentionbench-clear .ab-viewer-media img, #attentionbench-clear .ab-viewer-media video {display:block;margin:auto;width:100%;max-height:560px;object-fit:contain;}
  #attentionbench-clear .ab-viewer-media figcaption, #attentionbench-clear .ab-camera-caption {padding:10px 12px;font-size:12px;line-height:1.6;color:var(--muted,#aaa6b8);}
  #attentionbench-clear [data-preview-freshness] {font-variant-numeric:tabular-nums;color:var(--orange);}
  #attentionbench-clear [data-preview-freshness][data-state="live"] {color:var(--green,#8fbf87);}
  #attentionbench-clear [data-preview-freshness][data-state="offline"] {color:var(--red,#e98191);}
  #attentionbench-clear .ab-camera-caption {display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  #attentionbench-clear .ab-viewer-media a {color:var(--orange);}
  #attentionbench-clear .ab-viewer-media .ab-station-camera img {max-height:560px;}
  #attentionbench-clear .ab-viewer-trace {display:flex;flex-direction:column;min-height:0;padding:14px;border:1px solid var(--line,#3e3b4d);background:var(--panel2,#252531);font-size:13px;line-height:1.7;}
  #attentionbench-clear .ab-history-heading {display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-bottom:16px;font-size:13px;}
  #attentionbench-clear .ab-history-heading span {color:var(--muted,#aaa6b8);}
  #attentionbench-clear .ab-history-events {flex:1;min-height:0;max-height:480px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  #attentionbench-clear .ab-timeline-head {display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
  #attentionbench-clear .ab-timeline-head h4 {margin:0;font-size:14px;font-weight:600;}
  #attentionbench-clear .ab-timing-badge {font-size:10px;color:var(--orange);border:1px solid rgba(255,140,0,.3);padding:1px 6px;border-radius:3px;white-space:nowrap;}
  #attentionbench-clear .ab-timeline-help {font-size:11px;color:var(--muted);}
  #attentionbench-clear .ab-replay-status {font-size:10px;color:var(--muted);min-height:18px;margin:3px 0 10px;}
  #attentionbench-clear [data-history-event] {position:relative;margin:0 2px 6px 0;border:1px solid transparent;border-left:2px solid var(--line);border-radius:3px;background:var(--panel);}
  #attentionbench-clear [data-history-event]:hover {border-color:var(--line);border-left-color:var(--orange);}
  #attentionbench-clear [data-history-event][data-selected=true] {border-color:rgba(255,140,0,.4);border-left-color:var(--orange);background:rgba(255,140,0,.08);}
  #attentionbench-clear [data-history-event] summary {display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:3px 8px;padding:8px 10px;cursor:pointer;overflow-wrap:anywhere;list-style:none;}
  #attentionbench-clear [data-history-event] summary::-webkit-details-marker {display:none;}
  #attentionbench-clear [data-history-event] time {display:block;font:500 11px ui-monospace,monospace;color:var(--muted);}
  #attentionbench-clear [data-history-event] time a {color:var(--orange);text-decoration:none;border-bottom:1px dotted rgba(255,140,0,.5);}
  #attentionbench-clear [data-history-event] time a:hover {color:var(--text);}
  #attentionbench-clear [data-history-event] time a:focus-visible {outline:2px solid var(--cyan);outline-offset:3px;}
  #attentionbench-clear .ab-trace-operation {grid-column:1 / -1;font:500 12px/1.5 ui-monospace,monospace;color:var(--text);}
  #attentionbench-clear .ab-trace-state {font:500 9px ui-monospace,monospace;color:var(--muted);}
  #attentionbench-clear .ab-trace-state[data-state=completed] {color:#9bbb93;}
  #attentionbench-clear .ab-trace-state[data-state=failed] {color:#ed7189;}
  #attentionbench-clear [data-history-event] pre {margin:0;padding:8px 10px;border-top:1px solid var(--line);max-width:100%;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:var(--muted);}
  #attentionbench-clear .ab-trace-meta {flex:none;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);}
  #attentionbench-clear .ab-trace-meta summary {cursor:pointer;}
  #attentionbench-clear .ab-trace-meta p {max-height:65px;overflow:auto;}
  #attentionbench-clear .trace [data-request-replay] {color:var(--orange);text-decoration:none;}
  #attentionbench-clear .trace [data-request-replay]:hover {text-decoration:underline;}
  #attentionbench-clear .ab-history-identity, #attentionbench-clear .ab-history-failure {overflow-wrap:anywhere;}
  #attentionbench-clear .ab-history-failure {color:var(--red,#ed7189);}
  #attentionbench-clear .ab-history-empty {padding:20px;min-height:0;border:1px dashed var(--line,#3e3b4d);color:var(--muted,#aaa6b8);line-height:1.7;}
  #attentionbench-clear .ab-history-empty strong {color:var(--text,#eeebf5);}
  #attentionbench-clear .ab-current-view-caption {margin:0 0 12px;}
  #attentionbench-clear .ab-camera-empty {width:100%;min-width:0;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;aspect-ratio:16 / 9;min-height:260px;max-height:440px;padding:28px 24px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:center;color:var(--muted);}
  #attentionbench-clear .ab-camera-empty-icon {display:grid;place-items:center;width:44px;height:44px;margin-bottom:16px;border:1px solid #ff8c0033;border-radius:8px;background:#ff8c000a;color:var(--orange);}
  #attentionbench-clear .ab-camera-empty-icon svg {width:23px;height:23px;}
  #attentionbench-clear .ab-camera-empty-label {font:500 10px/1.5 ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
  #attentionbench-clear .ab-camera-empty strong {margin-top:7px;font-size:15px;font-weight:550;line-height:1.5;color:var(--text);}
  #attentionbench-clear .ab-camera-empty p {max-width:340px;margin:7px 0 0;font-size:12px;line-height:1.7;color:var(--muted);}
  #attentionbench-clear .ab-camera-empty-state {display:inline-flex;align-items:center;gap:7px;margin-top:18px;padding:4px 9px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-size:10px;line-height:1.5;color:var(--muted);}
  #attentionbench-clear .ab-camera-empty-state i {width:5px;height:5px;border-radius:50%;background:var(--orange);}
  #attentionbench-clear .ab-camera-empty[data-state=unavailable] .ab-camera-empty-icon {border-color:var(--line);background:var(--panel);color:var(--muted);}
  #attentionbench-clear .ab-viewer-trace .ab-history-intro {margin-top:8px;font-size:12px;line-height:1.7;color:var(--text);}
  #attentionbench-clear .ab-viewer-trace .ab-history-note {margin-top:10px;font-size:11px;line-height:1.7;color:var(--muted);}
  #attentionbench-clear .ab-viewer-trace .ab-history-recording-note {margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;line-height:1.7;color:var(--muted);}
  @media(max-width:760px) {#attentionbench-clear .ab-camera-empty {aspect-ratio:auto;min-height:240px;padding:24px 18px;}}

  #attentionbench-clear .panel.ab-budget-history {padding:0;overflow:hidden;}
  #attentionbench-clear .ab-budget-summary {display:flex;align-items:center;gap:14px;padding:15px 18px;list-style:none;}
  #attentionbench-clear summary.ab-budget-summary {cursor:pointer;}
  #attentionbench-clear summary.ab-budget-summary::-webkit-details-marker {display:none;}
  #attentionbench-clear summary.ab-budget-summary:hover {background:var(--panel2);}
  #attentionbench-clear summary.ab-budget-summary:focus-visible {outline:2px solid var(--cyan);outline-offset:-3px;}
  #attentionbench-clear .ab-budget-icon {display:grid;place-items:center;flex:none;width:32px;height:32px;border:1px solid rgba(255,140,0,.22);border-radius:6px;background:rgba(255,140,0,.07);color:var(--orange);font-size:20px;}
  #attentionbench-clear .ab-budget-copy {flex:1;min-width:0;}
  #attentionbench-clear .ab-budget-copy strong {display:block;font-size:14px;font-weight:600;}
  #attentionbench-clear .ab-budget-copy small {display:block;margin-top:4px;font-size:12px;line-height:1.6;color:var(--muted);}
  #attentionbench-clear .ab-budget-count {color:var(--muted);font-size:11px;white-space:nowrap;}
  #attentionbench-clear .ab-budget-expand {display:flex;gap:8px;align-items:center;font-size:12px;color:var(--orange);white-space:nowrap;}
  #attentionbench-clear .ab-budget-expand i {font-style:normal;transition:transform .15s;}
  #attentionbench-clear .ab-budget-history[open] .ab-budget-expand i {transform:rotate(180deg);}
  #attentionbench-clear .ab-budget-records {border-top:1px solid var(--line);padding:14px 18px;}
  #attentionbench-clear .ab-budget-note {color:var(--muted);font-size:12px;line-height:1.6;}
  #attentionbench-clear .ab-budget-record {margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:12px 14px;}
  #attentionbench-clear .ab-budget-record-head {display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;}
  #attentionbench-clear .ab-budget-record-head strong {color:#9bbb93;font-weight:600;}
  #attentionbench-clear .ab-budget-record-head span {color:var(--muted);}
  #attentionbench-clear .ab-budget-record dl {display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px 12px;margin:12px 0 0;font-size:11px;line-height:1.6;}
  #attentionbench-clear .ab-budget-record dt {color:var(--muted);}
  #attentionbench-clear .ab-budget-record dd {margin:0;min-width:0;overflow-wrap:anywhere;}
  #attentionbench-clear .ab-budget-record code {font:inherit;font-family:ui-monospace,monospace;}
  #attentionbench-clear .ab-eval-overview {display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,2fr);gap:12px;margin-bottom:16px;}
  #attentionbench-clear .ab-eval-result, #attentionbench-clear .ab-eval-stop {min-width:0;padding:15px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;}
  #attentionbench-clear .ab-eval-result {border-left:3px solid var(--muted);}
  #attentionbench-clear .ab-eval-result[data-native=failure] {border-left-color:#d1778a;}
  #attentionbench-clear .ab-eval-result[data-native=success] {border-left-color:#9bbb93;}
  #attentionbench-clear .ab-eval-overview strong {display:block;margin-top:9px;font-size:17px;font-weight:550;overflow-wrap:anywhere;}
  #attentionbench-clear .ab-eval-result[data-native=failure] strong {color:#ed9caf;}
  #attentionbench-clear .ab-eval-result[data-native=success] strong {color:#9bbb93;}
  #attentionbench-clear .ab-eval-overview small {display:block;margin-top:8px;color:var(--muted);font-size:11px;line-height:1.6;}
  #attentionbench-clear .ab-eval-diagnostic {padding:16px 18px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;}
  #attentionbench-clear .ab-eval-diagnostic-head {display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;}
  #attentionbench-clear .ab-eval-diagnostic-head h4 {margin:0;font-size:14px;font-weight:600;}
  #attentionbench-clear .ab-eval-diagnostic-head span {color:var(--muted);font:11px ui-monospace,monospace;}
  #attentionbench-clear .ab-diagnosis-body {font-size:13px;line-height:1.8;color:#cbc7d5;overflow-wrap:anywhere;}
  #attentionbench-clear .ab-diagnosis-body h4 {margin:16px 0 7px;padding-left:9px;border-left:2px solid var(--orange);color:var(--text);font-size:12px;font-weight:600;}
  #attentionbench-clear .ab-diagnosis-body p {margin-top:10px;}
  #attentionbench-clear .ab-diagnosis-body h4 + p {margin-top:0;}
  #attentionbench-clear .ab-diagnosis-body :is(ul,ol) {margin:8px 0 0;padding-left:20px;}
  #attentionbench-clear .ab-diagnosis-body li + li {margin-top:5px;}
  #attentionbench-clear .ab-diagnosis-body strong {color:var(--text);}
  #attentionbench-clear .ab-diagnosis-body code {padding:1px 4px;background:var(--panel);border:1px solid var(--line);border-radius:3px;font:11px/1.7 ui-monospace,monospace;box-decoration-break:clone;}
  #attentionbench-clear .ab-diagnosis-body pre {margin:10px 0 0;padding:10px;background:var(--panel);white-space:pre-wrap;overflow-wrap:anywhere;}
  #attentionbench-clear .ab-diagnosis-body pre code {padding:0;background:transparent;border:0;}
  #attentionbench-clear .ab-diagnosis-body .ab-eval-error {color:#ed9caf;}
  #attentionbench-clear .ab-eval-details {margin-top:14px;border-top:1px solid var(--line);padding-top:11px;font-size:12px;color:var(--muted);}
  #attentionbench-clear .ab-eval-details summary {cursor:pointer;line-height:1.7;color:var(--orange);}
  #attentionbench-clear .ab-eval-details summary span {margin-left:10px;color:var(--muted);font-size:11px;}
  #attentionbench-clear .ab-eval-details summary:focus-visible {outline:2px solid var(--cyan);outline-offset:3px;}
  #attentionbench-clear .ab-eval-details dl {display:grid;grid-template-columns:85px minmax(0,1fr);gap:8px 12px;margin:16px 0;line-height:1.7;}
  #attentionbench-clear .ab-eval-details dd {margin:0;min-width:0;overflow-wrap:anywhere;}
  #attentionbench-clear .ab-eval-details code {font:11px/1.7 ui-monospace,monospace;}
  #attentionbench-clear .ab-eval-source pre {white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.8 ui-monospace,monospace;max-height:260px;overflow:auto;padding:12px;background:var(--bg);border:1px solid var(--line);}
  @media(max-width:680px) {#attentionbench-clear .ab-eval-overview {grid-template-columns:minmax(0,1fr);} #attentionbench-clear .ab-eval-diagnostic {padding:14px;} #attentionbench-clear .ab-eval-details summary span {display:block;margin-left:14px;}}
  @media(max-width:520px) {#attentionbench-clear .ab-budget-summary {gap:10px;padding:13px 12px;} #attentionbench-clear .ab-budget-count {display:none;} #attentionbench-clear .ab-budget-records {padding:12px;}}
  @media(min-width:761px) {#attentionbench-clear .ab-viewer-media {min-height:280px;} #attentionbench-clear .ab-viewer-trace {contain:size;} #attentionbench-clear .ab-history-events {max-height:none;}}
  @media(max-width:760px) {#attentionbench-clear .ab-viewer-layout {grid-template-columns:minmax(0,1fr);} #attentionbench-clear .ab-history-events {max-height:360px;}}

/* Task progress: real attempts and frozen skill dependencies. */

#attentionbench-clear .ab-attempt-dag-dialog {box-sizing:border-box;width:min(880px,calc(100vw - 28px));max-height:calc(100dvh - 32px);border-color:var(--line);border-top:2px solid var(--orange);border-radius:10px;overflow:auto;}
#attentionbench-clear .ab-dag-dialog-header {display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:3;}
#attentionbench-clear .ab-dag-dialog-header h3 {font-size:18px;margin:0 0 5px;}
#attentionbench-clear .ab-dag-dialog-header span {font-size:12px;color:var(--muted);}
#attentionbench-clear .ab-dag-dialog-header button {padding:7px 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--text);font-family:inherit;cursor:pointer;}
#attentionbench-clear .ab-dag-dialog-body {padding:8px 22px 20px;min-width:0;}
#attentionbench-clear .ab-dag-dialog-body .ab-attempt-dag {margin:12px 0 0;}
#attentionbench-clear .ab-skill-detail>small {display:block;margin:6px 0;}
#attentionbench-clear [data-dag-stale-warning] {padding:8px;border:1px solid var(--red);color:#ffb7c3;font-size:12px;}
@media(max-width:600px){#attentionbench-clear .ab-attempt-dag-dialog {width:calc(100vw - 20px);max-height:calc(100dvh - 20px);}#attentionbench-clear .ab-dag-dialog-header {padding:14px;}#attentionbench-clear .ab-dag-dialog-body {padding:8px 14px 16px;}}

#attentionbench-clear .ab-flow-caption button {padding:3px 6px;font:inherit;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:4px;}
#attentionbench-clear .ab-task-flow {margin:12px 0 8px;border-top:1px solid var(--line);padding-top:9px;min-width:0;}
#attentionbench-clear .ab-flow-caption {display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);margin-bottom:6px;}
#attentionbench-clear .ab-flow-caption strong {color:var(--text);font-size:12px;}
#attentionbench-clear .ab-flow-scroll {overflow:auto;max-width:100%;scrollbar-color:#5f5f74 transparent;scrollbar-width:thin;padding:4px 0 8px;}
#attentionbench-clear .ab-graph-canvas {position:relative;width:max-content;min-width:100%;}
#attentionbench-clear .ab-flow-track,#attentionbench-clear .ab-skill-track {display:flex;align-items:center;gap:46px;padding:5px 3px;position:relative;z-index:1;width:max-content;}
#attentionbench-clear .ab-flow-node {box-sizing:border-box;position:relative;width:116px;min-height:70px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:9px 6px;background:var(--panel2);border:1px solid #57576b;border-radius:8px;color:var(--text);cursor:pointer;font-family:inherit;text-align:center;}
#attentionbench-clear .ab-flow-node b {font-size:13px;line-height:1.4;}
#attentionbench-clear .ab-flow-node small {font-size:10px;line-height:1.4;color:#c0bece;}
#attentionbench-clear .ab-node-symbol {position:absolute;left:7px;top:6px;font-size:8px;color:var(--muted);}
#attentionbench-clear .ab-flow-node[data-state=running] {border-color:#88b7cc;background:#22313b;}
#attentionbench-clear .ab-flow-node[data-state=waiting] {border-color:var(--orange);background:#493321;box-shadow:0 0 0 1px #ff982e44;}
#attentionbench-clear .ab-flow-node[data-state=waiting] small {color:#ffbc71;}
#attentionbench-clear .ab-flow-node:is([data-state=failed],[data-state=timed_out]) {border-color:#a66c7e;background:#352733;}
#attentionbench-clear .ab-flow-node[data-state=succeeded] {border-color:#6d9e87;background:#24382e;}
#attentionbench-clear .ab-flow-node:is([data-state=unknown],[data-state=planned]) {border-style:dashed;background:#22222d;}
#attentionbench-clear .ab-flow-node[data-state=planned] {color:#bab7c8;border-color:#555366;}
#attentionbench-clear .ab-flow-node[data-state=blocked] {border-color:#b99459;background:#393123;}
#attentionbench-clear .ab-flow-node[aria-pressed=true] {outline:2px solid var(--orange);outline-offset:3px;}
#attentionbench-clear .ab-flow-node:focus-visible {outline:3px solid #9cc6e7;outline-offset:3px;}
#attentionbench-clear .ab-graph-lines {position:absolute;left:0;top:0;pointer-events:none;overflow:visible;}
#attentionbench-clear .ab-graph-lines g>path {fill:none;stroke:#87869b;stroke-width:1.4;}
#attentionbench-clear .ab-graph-lines marker path {fill:#87869b;}
#attentionbench-clear .ab-graph-lines g[data-state=planned]>path,#attentionbench-clear .ab-graph-lines g[data-state=unconfirmed]>path {stroke-dasharray:4 4;stroke:#777282;}
#attentionbench-clear .ab-graph-lines text {fill:#b6aec3;font:9px sans-serif;text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round;}
#attentionbench-clear [data-task-flow][data-stale=true] {opacity:.75;}
#attentionbench-clear [data-task-flow][data-stale=true] .ab-flow-caption:after {content:'Older snapshot';color:#ff9bac;}
#attentionbench-clear .ab-attempt-dag {margin:14px 0;min-width:0;}
#attentionbench-clear .ab-skill-level {display:flex;flex-direction:column;gap:15px;}
#attentionbench-clear .ab-skill-track {gap:48px;}
#attentionbench-clear .ab-skill-track .ab-flow-node {width:128px;min-height:76px;}
#attentionbench-clear .ab-skill-detail {padding:12px;margin-top:10px;border:1px solid var(--line);background:var(--panel2);font-size:12px;line-height:1.6;}
#attentionbench-clear .ab-skill-detail>b {font-size:14px;margin-right:12px;}
#attentionbench-clear .ab-skill-detail>span {color:var(--muted);}
#attentionbench-clear .ab-skill-detail p {margin:8px 0;overflow-wrap:anywhere;}
#attentionbench-clear .ab-skill-detail button {margin:6px 0;}
#attentionbench-clear .ab-skill-detail details {margin-top:8px;}
#attentionbench-clear .ab-dag-gap {padding:14px;margin-top:12px;border:1px dashed #666075;border-radius:6px;font-size:13px;}
#attentionbench-clear .ab-dag-gap small {display:block;margin-top:5px;color:var(--muted);font-size:11px;}
#attentionbench-clear .ab-node-detail {min-width:0;}
#attentionbench-clear .ab-node-detail .panel-title {margin-bottom:12px;}
#attentionbench-clear .ab-node-detail .panel-title>span {color:var(--muted);font-size:11px;}
#attentionbench-clear .ab-node-summary {display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;}
#attentionbench-clear .ab-node-summary>span {color:var(--muted);}
#attentionbench-clear .ab-node-summary>button {margin-left:auto;}
#attentionbench-clear [data-node-technical] {border-top:1px solid var(--line);margin-top:12px;padding-top:8px;}
#attentionbench-clear [data-node-technical] pre {max-height:300px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;margin-top:10px;}
#attentionbench-clear .ab-source-badge {display:inline-block;margin-bottom:12px;font-size:11px;padding:5px 9px;border:1px solid #686071;border-radius:20px;background:var(--panel2);color:#d8cde2;}
#attentionbench-clear .ab-feedback-layers {gap:8px;margin-top:12px;}
#attentionbench-clear [data-feedback-layer] {border-radius:6px;padding:10px;}

/* Compact request guidance; technical evidence stays available on demand. */

/* Submitted hint content is core information, separate from adoption evidence. */
#attentionbench-clear .ab-submitted-hint {margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:8px;background:var(--panel2);}

#attentionbench-clear [data-hint-body] {margin-top:8px;font-size:13px;line-height:1.7;overflow-wrap:anywhere;}

.ab-camera-views{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.ab-camera-views button{max-width:100%;white-space:normal}.ab-camera-views button[aria-pressed="true"]{border-color:var(--gold,#d9b85e);color:var(--gold,#d9b85e)}

#attentionbench-clear .ab-arm-status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0;}

#attentionbench-clear .op-field.op-warn b{color:#92400e}
#attentionbench-clear .op-warn-text{color:#92400e}
#attentionbench-clear .op-review-preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
#attentionbench-clear .op-ai-review details[open]+.op-review-preview{display:none}
#attentionbench-clear .op-ai-review details p{white-space:pre-wrap;overflow-wrap:anywhere}
#attentionbench-clear .op-eval-toggle{display:flex;gap:8px;align-items:center}
#attentionbench-clear .op-eval-toggle input{width:auto}
</style>

<body>
<div id="attentionbench-clear" class="ab-industrial" data-mode="live" aria-label="AttentionBench operations workspace">
<style>
#attentionbench-clear{--bg:#111119;--panel:#1d1d29;--panel2:#252531;--line:#3c3a4b;--text:#f5f4f8;--muted:#b3afc0;--orange:#ff8c00;--cyan:#13cce6;--purple:#b975ef;--green:#39e51d;--body:Ubuntu,ui-rounded,"Hiragino Maru Gothic ProN","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;--heading:var(--body);background:var(--bg);color:var(--text);border:1px solid var(--line);font-family:var(--body);width:100%;box-sizing:border-box;overflow:hidden}

#attentionbench-clear .agent-icon{display:grid;place-items:center;width:34px;height:34px;background:#382b24;color:#ffb65e;font:700 10px ui-monospace,monospace}#attentionbench-clear .agent-row.eval .agent-icon{background:#20343a;color:var(--cyan)}

#attentionbench-clear .segmented{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border:1px solid var(--line);background:var(--bg);margin:11px 0 8px}#attentionbench-clear .segmented span{display:grid;place-items:center;min-height:32px;padding:5px 3px;color:var(--muted);text-align:center;font:600 10px ui-monospace,monospace;line-height:1.2}#attentionbench-clear .segmented .selected{background:#44301c;color:#ffd49d;box-shadow:inset 0 0 0 1px #96602c}

#attentionbench-clear.ab-industrial .ab-sidebar nav{max-height:440px;scrollbar-color:#a9ae9f transparent;}
#attentionbench-clear.ab-industrial .ab-sidebar nav>[data-task-group]{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;}
#attentionbench-clear.ab-industrial .ab-sidebar nav>[data-task-group][data-viewing=true]{background:none;border-color:var(--line);}
#attentionbench-clear.ab-industrial .ab-sidebar .ab-task-summary{padding:12px 0;gap:8px;background:none;}

#attentionbench-clear.ab-industrial .ab-task-copy>strong{font-size:12px;}
#attentionbench-clear.ab-industrial :is(.ab-task-count,.ab-task-count b,.ab-task-chevron){border:0;border-radius:0;background:none;color:var(--muted);}

#attentionbench-clear.ab-industrial .ab-task-viewing{color:var(--orange);}
#attentionbench-clear.ab-industrial .ab-task-runs{padding:0 0 2px;background:none;border:0;}
#attentionbench-clear.ab-industrial .ab-sidebar .ab-task-runs article{padding:12px 0;border:0;border-top:1px solid var(--line);border-radius:0;background:none;}
#attentionbench-clear.ab-industrial .ab-sidebar .ab-task-runs article[data-viewing=true]{padding:12px;border:1px solid var(--text);background:var(--panel);box-shadow:2px 2px 0 #c7cbbb;}
#attentionbench-clear.ab-industrial .ab-sidebar-run-head>[data-view-run]{background:none;border:0;box-shadow:none;transform:none;}
#attentionbench-clear.ab-industrial .ab-sidebar [data-run-name]{font-size:12px;}
#attentionbench-clear.ab-industrial :is(.ab-run-viewing,.ab-run-status,.ab-run-id){border:0;border-radius:0;background:none;font-size:11px;color:var(--muted);}
#attentionbench-clear.ab-industrial .ab-run-viewing{color:var(--orange);}
#attentionbench-clear.ab-industrial .ab-run-status:is([data-status=completed],[data-status=running]){color:var(--green);background:none;}
#attentionbench-clear.ab-industrial .ab-run-status:is([data-status=failed],[data-status=cancelled]){color:var(--red);background:none;}
#attentionbench-clear.ab-industrial .ab-sidebar :is([data-pin-run],[data-run-path]>summary,[data-run-name-editor]>summary){color:var(--muted);font-size:11px;background:none;border-radius:0;box-shadow:none;}
#attentionbench-clear.ab-industrial .ab-sidebar .ab-run-actions button{border:1px solid var(--text);border-radius:0;background:var(--panel);font-size:11px;box-shadow:0 2px 0 #b3b8a6;}
#attentionbench-clear.ab-industrial :is(.ab-policy-controller,.ab-executing-runs){border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:15px 0 0;}
#attentionbench-clear.ab-industrial .ab-sidebar .ab-control-header h2{font:600 20px var(--heading);}
#attentionbench-clear.ab-industrial .ab-sidebar .ab-control-header h3{font-size:11px;color:var(--muted);}
#attentionbench-clear.ab-industrial :is(.ab-control-icon,.ab-policy-icon){border:0;border-radius:0;background:none;color:var(--muted);}
#attentionbench-clear.ab-industrial .ab-control-mode{border-color:var(--line);border-radius:0;background:var(--panel2);color:var(--muted);font-size:11px;}
#attentionbench-clear.ab-industrial .ab-policy-context{padding:9px 0;border:0;border-radius:0;background:none;}
#attentionbench-clear.ab-industrial :is(.ab-context-label,.ab-policy-context code){color:var(--muted);font-size:11px;}
#attentionbench-clear.ab-industrial .ab-policy-cards{gap:0;}
#attentionbench-clear.ab-industrial .ab-sidebar .ab-policy-cards button{min-height:42px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;box-shadow:none;color:var(--muted);}

#attentionbench-clear.ab-industrial .ab-sidebar .ab-policy-cards button[data-state=Active]{background:#e8e9dc;color:var(--text);border-color:var(--line);box-shadow:inset 2px 0 var(--orange);}
#attentionbench-clear.ab-industrial .ab-policy-cards [data-state=Active] .ab-policy-icon{border:0;background:none;color:var(--orange);}
#attentionbench-clear.ab-industrial .ab-sidebar .ab-policy-state,#attentionbench-clear.ab-industrial .ab-sidebar .ab-policy-cards [data-state=Active] .ab-policy-state{border:0;border-radius:0;background:none;color:var(--muted);font-size:11px;padding:0;}
#attentionbench-clear.ab-industrial .ab-sidebar .ab-linked-policy-run{border:1px solid var(--text);border-radius:0;background:var(--panel);color:var(--text);}
#attentionbench-clear.ab-industrial .ab-linked-policy-run>span:first-of-type{font-size:11px;}
#attentionbench-clear.ab-industrial .ab-linked-policy-run>span:last-child{color:var(--orange);}
#attentionbench-clear.ab-industrial :is(.ab-executing-empty,.ab-executing-card,.ab-executing-count){border-color:var(--line);border-radius:0;background:var(--panel2);color:var(--muted);}
#attentionbench-clear.ab-industrial .ab-executing-empty strong,#attentionbench-clear.ab-industrial .ab-sidebar .ab-executing-empty small{color:var(--muted);font-size:11px;}
/* 01: grouped parameter decks rather than ten unrelated boxes. */
#attentionbench-clear.ab-industrial .ab-run-settings,#attentionbench-clear.ab-industrial .ab-resource-details{padding:16px;}
#attentionbench-clear.ab-industrial .ab-settings-state{border:1px solid var(--line);border-left:2px solid var(--orange);border-radius:0;background:var(--panel2);color:var(--muted);font-size:11px;}
#attentionbench-clear.ab-industrial .ab-settings-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0;}
#attentionbench-clear.ab-industrial .ab-settings-grid>.ab-param-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0;margin:0;padding:0;border:1px solid var(--line);border-radius:0;background:linear-gradient(#f2f0e7,#eae8dc);box-shadow:inset 0 2px 3px #24282209,0 1px 0 #fffdf5;}
#attentionbench-clear.ab-industrial .ab-settings-grid>.ab-param-task{grid-column:1/-1;grid-template-columns:minmax(0,3fr) minmax(90px,1fr);border-left:3px solid var(--orange);background:linear-gradient(110deg,#f0e7d7,#eeede1);}
#attentionbench-clear.ab-industrial .ab-settings-grid>.ab-param-execution{grid-column:1/-1;grid-template-columns:repeat(var(--param-columns,4),minmax(0,1fr));}
#attentionbench-clear.ab-industrial .ab-settings-grid>.ab-param-policy{grid-column:1/-1;}
#attentionbench-clear.ab-industrial .ab-param-group>div{grid-column:auto;min-width:0;padding:9px 10px;}
#attentionbench-clear.ab-industrial .ab-param-group>div+div{box-shadow:inset 1px 0 0 var(--line);}
#attentionbench-clear.ab-industrial .ab-settings-grid dt{margin:0 0 5px;font:11px/1.4 var(--body);color:var(--muted);}
#attentionbench-clear.ab-industrial .ab-settings-grid dd{margin:0;font:600 12px/1.5 var(--body);overflow-wrap:anywhere;}
#attentionbench-clear.ab-industrial [data-setting=Benchmark] dd{font:500 12px/1.5 var(--mono);}
#attentionbench-clear.ab-industrial .ab-run-details{margin:10px 0 0;border-top:1px solid var(--line);color:var(--muted);font-size:11px;}
#attentionbench-clear.ab-industrial .ab-run-details>summary{padding:9px 0 0;font:600 12px/1.5 var(--body);color:var(--text);cursor:pointer;}
#attentionbench-clear.ab-industrial .ab-run-details>summary>span{margin-left:12px;font-weight:400;color:var(--muted);}
#attentionbench-clear.ab-industrial .ab-run-details[open]>summary{padding-bottom:9px;}
#attentionbench-clear.ab-industrial .ab-run-details>dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:0;border:1px solid var(--line);background:var(--panel2);}
#attentionbench-clear.ab-industrial .ab-run-details>dl>div{min-width:0;padding:8px 10px;border-bottom:1px solid var(--line);}
#attentionbench-clear.ab-industrial .ab-run-details dt{margin:0 0 4px;color:var(--muted);font:11px/1.4 var(--body);}
#attentionbench-clear.ab-industrial .ab-run-details dd{margin:0;color:var(--text);font:500 11px/1.5 var(--mono);overflow-wrap:anywhere;}
#attentionbench-clear.ab-industrial .ab-task-description{padding:0;margin-top:10px;gap:8px;border:0;border-radius:0;background:none;}
#attentionbench-clear.ab-industrial .ab-task-description>span{color:var(--muted);}
#attentionbench-clear.ab-industrial .ab-task-description p{color:var(--text);font-size:11px;line-height:1.5;}
#attentionbench-clear.ab-industrial .ab-settings-agents{gap:10px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);}
#attentionbench-clear.ab-industrial .ab-settings-agents .agent-row{display:block;margin:0;padding:0;border:0;border-radius:0;background:none;}
#attentionbench-clear.ab-industrial .ab-settings-agents .agent-icon{display:none;}
#attentionbench-clear.ab-industrial .agent-info b{color:var(--muted);font:11px/1.5 var(--body);}
#attentionbench-clear.ab-industrial .agent-info small{margin-top:3px;color:var(--text);font:500 11px/1.5 var(--body);}
#attentionbench-clear.ab-industrial .ab-agent-fields{margin:4px 0 0;padding:0;}
#attentionbench-clear.ab-industrial .ab-agent-fields dt{color:var(--muted);font-size:11px;}
#attentionbench-clear.ab-industrial .model-tag{border-color:var(--line);border-radius:0;background:var(--panel2);color:var(--text);}
/* 02: the real status/actions remain available, including the floating bar. */
#attentionbench-clear.ab-industrial [data-run-overview]:not([data-floating=true]){position:relative;top:auto;border-top:1px solid #bcbfb2;}
#attentionbench-clear.ab-industrial .ab-status-panel-heading{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--text);font:600 22px/1.2 var(--heading);text-transform:uppercase;}
#attentionbench-clear.ab-industrial .ab-status-panel-heading::before{content:'02' / '';display:grid;place-items:center;width:27px;height:29px;background:var(--text);color:var(--panel);box-shadow:2px 2px 0 var(--orange);font:600 23px var(--heading);}
#attentionbench-clear.ab-industrial .ab-status-head{flex-wrap:wrap;align-items:center;}
#attentionbench-clear.ab-industrial .ab-status-head>div:first-of-type{flex:1 1 100%;}
#attentionbench-clear.ab-industrial [data-run-overview]:not([data-floating=true]) .ab-status-head h2{font:600 36px/1.1 var(--heading);letter-spacing:-.4px;}
#attentionbench-clear.ab-industrial [data-run-overview]:not([data-floating=true]) .ab-status-head .label{color:var(--muted);font:11px/1.5 var(--body);}

#attentionbench-clear.ab-industrial .ab-status-controls{width:100%;justify-content:start;gap:8px;}
#attentionbench-clear.ab-industrial .ab-status-controls>button{min-height:38px;border-color:var(--text);box-shadow:0 3px 0 #939b89;}
#attentionbench-clear.ab-industrial .ab-status-controls>.ab-button-primary{box-shadow:0 3px 0 var(--orange);}
#attentionbench-clear.ab-industrial .ab-status-controls>.danger{margin-left:auto;background:#f0e1d7;border-color:#bc8d79;color:var(--red);}
#attentionbench-clear.ab-industrial .ab-status-controls>.danger:disabled{background:#eae9dd;color:var(--muted);border-color:var(--line);box-shadow:none;}
#attentionbench-clear.ab-industrial .ab-overview-toggle{font-size:11px;}
#attentionbench-clear.ab-industrial .ab-status-main{gap:10px;margin-top:18px;padding:12px;background:#e8e9dc;border:1px solid var(--line);}
#attentionbench-clear.ab-industrial .ab-action-needed{font-size:14px;padding:8px 10px;border-radius:0;}

#attentionbench-clear.ab-industrial .ab-phase-copy{margin-left:auto;text-align:right;gap:3px;font-size:11px;}

#attentionbench-clear.ab-industrial .ab-status-meta{padding-top:10px;border-top:1px solid var(--line);color:var(--muted);}
#attentionbench-clear.ab-industrial .ab-status-alerts{color:var(--muted);font-size:11px;line-height:1.7;}
#attentionbench-clear.ab-industrial [data-stop-state]{background:none;color:var(--green);border:0;padding:0;}
#attentionbench-clear.ab-industrial :is([data-timeout-warning],[data-resource-warning],#ab-stale-warning){background:#f3e2d6;color:#8f3d28;border-color:var(--orange);}
#attentionbench-clear.ab-industrial [data-run-overview][data-floating=true]{background:var(--panel);border-color:var(--line);box-shadow:3px 4px 0 #24282226;}
#attentionbench-clear.ab-industrial [data-floating=true] .ab-status-panel-heading{display:none;}

#attentionbench-clear.ab-industrial [data-floating=true] .ab-status-controls{width:auto;}
#attentionbench-clear.ab-industrial [data-floating=true] .ab-status-main{margin-top:7px;padding:7px;}
#attentionbench-clear.ab-industrial .ab-flow-node{border-color:#a8af9a;border-radius:0;background:var(--panel2);color:var(--text);box-shadow:0 2px 0 #c7cbbb;}
#attentionbench-clear.ab-industrial .ab-flow-node small{color:var(--muted);font-size:11px;}
#attentionbench-clear.ab-industrial .ab-flow-node:is([data-state=failed],[data-state=timed_out]){background:#efdfd6;border-color:#bb8d78;}
#attentionbench-clear.ab-industrial .ab-flow-node[data-state=succeeded]{background:#e5e9db;border-color:#a3b293;}
#attentionbench-clear.ab-industrial .ab-flow-node[data-state=running]{background:#e3e9dc;border-color:#859d72;}
#attentionbench-clear.ab-industrial .ab-flow-node[data-state=waiting]{background:#f4e2c8;border-color:var(--orange);}
#attentionbench-clear.ab-industrial .ab-flow-node:is([data-state=unknown],[data-state=planned],[data-state=blocked]){background:#eeece1;color:var(--muted);border-color:#b9bfaa;}
#attentionbench-clear.ab-industrial .ab-graph-lines g>path{stroke:#919a84;}
#attentionbench-clear.ab-industrial .ab-graph-lines marker path{fill:#919a84;}
#attentionbench-clear.ab-industrial .ab-graph-lines text{fill:var(--muted);}
/* 03: media and transport share one machined-looking console. */
#attentionbench-clear.ab-industrial .ab-history-tabs{gap:0;width:fit-content;border:1px solid var(--text);background:var(--panel2);}
#attentionbench-clear.ab-industrial .ab-history-tabs button{padding:8px 12px;border:0;border-radius:0;background:none;box-shadow:none;color:var(--muted);}
#attentionbench-clear.ab-industrial .ab-history-tabs button[aria-pressed=true]{background:var(--text);color:var(--panel);box-shadow:inset 0 -3px var(--orange);}
#attentionbench-clear.ab-industrial .ab-history-heading{font-size:11px;gap:6px 14px;margin-bottom:12px;}
#attentionbench-clear.ab-industrial .ab-history-heading b{font-weight:400;color:var(--muted);}
#attentionbench-clear.ab-industrial .ab-viewer-layout{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;}
#attentionbench-clear.ab-industrial .ab-viewer-media{min-height:0;}
#attentionbench-clear.ab-industrial .ab-viewer-media figure{border:1px solid #858e79;background:#e9e7da;box-shadow:0 3px 0 #b3b8a6;}

#attentionbench-clear.ab-industrial .ab-viewer-media figcaption{padding:9px 10px;color:var(--muted);font:11px/1.6 var(--body);}
#attentionbench-clear.ab-industrial .ab-replay-transport{display:flex;align-items:center;gap:8px;padding:9px;border-top:1px solid #b6bdab;background:linear-gradient(#f1efe4,#e6e4d6);}
#attentionbench-clear.ab-industrial .ab-replay-transport button{flex:none;min-width:32px;min-height:30px;padding:5px 7px;font-size:11px;border-color:#a8af9a;}
#attentionbench-clear.ab-industrial .ab-replay-transport button svg{display:block;width:14px;height:14px;}
#attentionbench-clear.ab-industrial .ab-replay-transport [data-replay-play]{background:linear-gradient(#454d3f,#252d22);color:var(--panel);border-color:var(--text);box-shadow:0 2px 0 var(--orange);font-size:14px;}
#attentionbench-clear.ab-industrial .ab-replay-transport time{font:11px var(--mono);white-space:nowrap;}
#attentionbench-clear.ab-industrial .ab-replay-scrubber{flex:1;position:relative;min-width:45px;height:28px;--seek:0%;}
#attentionbench-clear.ab-industrial .ab-replay-scrubber input{appearance:none;display:block;position:relative;width:100%;height:28px;margin:0;padding:0;background:transparent;cursor:ew-resize;}
#attentionbench-clear.ab-industrial .ab-replay-scrubber input::-webkit-slider-runnable-track{height:4px;background:linear-gradient(to right,var(--orange) var(--seek),#c8ccbb var(--seek));border-radius:0;}
#attentionbench-clear.ab-industrial .ab-replay-scrubber input::-webkit-slider-thumb{appearance:none;width:10px;height:17px;margin-top:-6.5px;border-radius:0;background:linear-gradient(90deg,var(--orange),#f39461 45%,var(--orange) 55%);box-shadow:0 0 0 2px #eeecdf,0 2px 3px #24282220;}
#attentionbench-clear.ab-industrial .ab-replay-scrubber input::-moz-range-track{height:4px;background:#c8ccbb;}
#attentionbench-clear.ab-industrial .ab-replay-scrubber input::-moz-range-progress{height:4px;background:var(--orange);}
#attentionbench-clear.ab-industrial .ab-replay-scrubber input::-moz-range-thumb{width:10px;height:17px;border:0;border-radius:0;background:var(--orange);}
#attentionbench-clear.ab-industrial .ab-replay-bubble{position:absolute;bottom:34px;left:clamp(26px,var(--seek),calc(100% - 26px));transform:translate(-50%,4px);padding:4px 6px;border:1px solid var(--text);background:var(--text);color:var(--panel);font:11px/1.4 var(--mono);opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .15s,transform .15s;z-index:2;}
#attentionbench-clear.ab-industrial .ab-replay-scrubber:is(:hover,:focus-within) .ab-replay-bubble{opacity:1;transform:translate(-50%,0);}
#attentionbench-clear.ab-industrial .ab-viewer-trace{contain:none;min-height:0;max-height:none;padding:12px;border:1px solid var(--line);background:#eae9dc;color:var(--text);box-shadow:inset 0 1px 3px #2428220b;font-size:11px;}
#attentionbench-clear.ab-industrial .ab-timeline-head{flex-wrap:wrap;gap:6px;}

#attentionbench-clear.ab-industrial .ab-timing-badge{border-color:#c4b59d;color:#936047;font-size:10px;}
#attentionbench-clear.ab-industrial .ab-replay-status{font-size:11px;line-height:1.5;}
#attentionbench-clear.ab-industrial .ab-history-events{flex:none;max-height:330px;scrollbar-color:#a9ae9f transparent;}
#attentionbench-clear.ab-industrial [data-history-event]{border:0;border-left:2px solid transparent;border-bottom:1px solid var(--line);border-radius:0;background:none;margin:0;transition:background .2s,border-color .2s;}

#attentionbench-clear.ab-industrial [data-history-event][data-selected=true]{background:linear-gradient(100deg,#fbf8ed,#eeeadd);border-left-color:var(--orange);box-shadow:inset 0 1px 0 #fffdf5;}
#attentionbench-clear.ab-industrial [data-history-event] summary time{font:11px/1.5 var(--mono);color:var(--muted);}
#attentionbench-clear.ab-industrial [data-history-event] time a{color:var(--muted);border-bottom-color:#a9ae9f;}
#attentionbench-clear.ab-industrial .ab-trace-operation{color:var(--text);font:500 11px/1.6 var(--mono);}
#attentionbench-clear.ab-industrial .ab-trace-state{font-size:11px;color:var(--muted);}
#attentionbench-clear.ab-industrial .ab-trace-state[data-state=completed]{color:var(--green);}
#attentionbench-clear.ab-industrial .ab-trace-state[data-state=failed],#attentionbench-clear.ab-industrial .ab-history-failure{color:var(--red);}
#attentionbench-clear.ab-industrial .ab-trace-meta{font-size:11px;}
#attentionbench-clear.ab-industrial .ab-camera-empty{background:var(--panel2);border-radius:0;color:var(--muted);}
#attentionbench-clear.ab-industrial .ab-camera-empty-icon{background:var(--panel);border-color:var(--line);border-radius:0;color:var(--orange);}
#attentionbench-clear.ab-industrial .ab-camera-empty-state{background:var(--panel);border-radius:0;}
/* 04 and 05 stay shallow; values and units have separate typographic roles. */
